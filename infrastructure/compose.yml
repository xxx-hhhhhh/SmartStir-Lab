services:
  api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      MQTT_CA_PATH: /run/ca/emqx-ca.pem
      DB_PATH: /var/lib/smartstir/local.db
    volumes:
      - ../backend/emqx-ca.pem:/run/ca/emqx-ca.pem:ro
      - smartstir_db:/var/lib/smartstir
    expose:
      - "8000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
volumes:
  caddy_data:
  caddy_config:
  smartstir_db:
