name: Check live Railway V1.3 gateway
on:
  push:
    branches: [feature/labs-users-i18n-v1.3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify HTTPS, health and auth guard
        shell: bash
        run: |
          set -euo pipefail
          base="https://smartstir-gateway-v13-production.up.railway.app"
          echo "Checking V1.3 HTTPS health"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 4 --max-time 15 "$base/health" -o /tmp/health.json
          python3 - <<'PY'
          import json
          with open('/tmp/health.json') as f:
              data = json.load(f)
          assert data.get('api') == 'ok', data
          assert data.get('version') == '1.3.0', data
          assert data.get('database') == 'configured', data
          print('PASS: Gateway V1.3 and database initialized')
          print('MQTT transport connected:', data.get('mqtt_connected'))
          PY
          status="$(curl --silent --show-error --output /tmp/labs-anonymous.json --write-out '%{http_code}' --max-time 15 "$base/api/v1/labs")"
          if [ "$status" != "401" ]; then
            echo "Expected HTTP 401 for anonymous labs, received $status"; exit 1
          fi
          echo "PASS: Anonymous access denied"
